<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Griffy&family=IBM+Plex+Mono:wght@600;700&display=block" rel="stylesheet">
<style>
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#14101c}
.bg{position:absolute;inset:0;background:url("file:///C:/Users/Ckacha/Desktop/Projects/Ghost_Ship/static/media/fillout-background.png") center/cover}
.top{position:absolute;left:0;right:0;top:80px;display:flex;flex-direction:column;align-items:center;gap:28px}
h1{margin:0;font-family:Griffy,cursive;font-weight:400;font-size:190px;line-height:1;color:#ff8f3f;text-shadow:0 0 50px rgba(255,143,63,.35),0 6px 0 #7a3a12}
p{margin:0;font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:40px;color:#f4ecd9;letter-spacing:1px}
.sheet{position:absolute;left:330px;top:415px;width:720px;border-radius:24px;border:7px solid #ff8f3f;box-shadow:0 20px 60px rgba(0,0,0,.6);transform:rotate(-2deg)}
svg{position:absolute;inset:0}
</style></head><body>
<div class="bg"></div>
<div class="top">
  <h1>Ghost Ship</h1>
  <p>Build a spooky game and get candy!</p>
</div>
<img class="sheet" src="file:///C:/Users/Ckacha/Desktop/Projects/Ghost_Ship/static/media/stickersheet.png">
<svg width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <g id="wrap">
      <polygon points="-30,0 -75,-32 -75,32" style="fill:var(--a)" stroke="#14101c" stroke-width="5" stroke-linejoin="round"/>
      <polygon points="30,0 75,-32 75,32" style="fill:var(--a)" stroke="#14101c" stroke-width="5" stroke-linejoin="round"/>
      <circle r="36" style="fill:var(--b)" stroke="#14101c" stroke-width="5"/>
      <circle cx="-12" cy="-12" r="9" fill="#fff" opacity=".55"/>
    </g>
    <clipPath id="cc"><polygon points="0,-70 48,50 -48,50"/></clipPath>
    <g id="corn">
      <g clip-path="url(#cc)">
        <rect x="-60" y="-75" width="120" height="50" fill="#f4ecd9"/>
        <rect x="-60" y="-25" width="120" height="40" fill="#ff8f3f"/>
        <rect x="-60" y="15" width="120" height="40" fill="#f2c94c"/>
      </g>
    </g>
    <g id="lolly">
      <rect x="-6" y="20" width="12" height="110" rx="6" fill="#f4ecd9"/>
      <circle r="50" style="fill:var(--a)"/>
      <circle r="34" fill="none" stroke="#fff" stroke-width="8" opacity=".7"/>
      <circle r="16" fill="none" stroke="#fff" stroke-width="8" opacity=".7"/>
    </g>
  </defs>

  <!-- p5.js logo -->
  <g transform="translate(1395 850) scale(.8)">
    <rect x="-210" y="-62" width="420" height="124" rx="62" fill="#fff" stroke="#ED225D" stroke-width="6"/>
    <text x="-38" y="30" text-anchor="end" font-family="IBM Plex Mono, monospace" font-weight="700" font-size="88" fill="#ED225D">p5</text>
    <g transform="translate(0 -4)" fill="#ED225D">
      <rect x="-9" y="-36" width="18" height="36" rx="5"/>
      <rect x="-9" y="-36" width="18" height="36" rx="5" transform="rotate(72)"/>
      <rect x="-9" y="-36" width="18" height="36" rx="5" transform="rotate(144)"/>
      <rect x="-9" y="-36" width="18" height="36" rx="5" transform="rotate(216)"/>
      <rect x="-9" y="-36" width="18" height="36" rx="5" transform="rotate(288)"/>
    </g>
    <text x="38" y="30" text-anchor="start" font-family="IBM Plex Mono, monospace" font-weight="700" font-size="88" fill="#ED225D">js</text>
  </g>

  <!-- candy to the right of the sheet -->
  <use href="#lolly" transform="translate(1290 490) rotate(-15) scale(.9)" style="--a:#b27cff"/>
  <use href="#wrap" transform="translate(1485 490) rotate(20) scale(.9)" style="--a:#8fd6b0;--b:#ff8f3f"/>
  <use href="#corn" transform="translate(1240 680) rotate(-15) scale(.9)"/>
  <use href="#wrap" transform="translate(1400 670) rotate(-10) scale(.9)" style="--a:#f2c94c;--b:#ED225D"/>
  <use href="#corn" transform="translate(1555 675) rotate(20) scale(.9)"/>
</svg>
</body></html>
